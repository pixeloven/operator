---
# PixelOven gates — task A1.2 · requirements O-1, O-3, G-2, G-3, G-6.
#
# A workflow PixelOven OWNS. ADR-0010 permits bounded companion-source hunks in
# upstream's `ci.yml` and `no-mistakes-required.yml`; every other inherited
# workflow remains upstream-owned. The checks here grade PixelOven's surfaces
# and those exact exceptions rather than treating inherited code as ours.
#
# Composed from the harmony-ci action library's github-hosted template
# (https://github.com/ductiletoaster/harmony-ci, templates/ci-github-hosted.yml),
# adapted where this repository differs from that template's assumptions.
#
# ── Runner ────────────────────────────────────────────────────────────────────
# Linux gates use standard GitHub-hosted runners.
# The pinned binary installs remain intentional because these gates own their
# tool versions and do not assume mutable runner image contents.
#
# ── Cost ──────────────────────────────────────────────────────────────────────
# The historical private-repository billing measurement remains in
# docs/pixeloven/releases.md. Keep two concurrency-cancelling jobs and no
# aggregator so the distinct gate results stay visible.
#
# ── Gate selection (judgement calls, recorded) ────────────────────────────────
#   gitleaks      YES  — required. Pinned release binary + SHA256, NOT the
#                        marketplace action: gitleaks/gitleaks-action demands a
#                        GITLEAKS_LICENSE secret for ORGANIZATION-owned repos and
#                        `pixeloven` is an org. Runs with --redact (G-3).
#   actionlint    YES  — the workflow YAML we author is the only new executable
#                        surface this fork adds today. actionlint parses it and
#                        runs shellcheck over its `run:` blocks.
#   shellcheck    NO   — upstream's `ci.yml` already owns it via `bin/fm-lint.sh`,
#                        which is the single owner of the lint definition. Not
#                        duplicated. (actionlint still shellchecks OUR run blocks.)
#   yamllint      NO   — actionlint already validates the workflow YAML we author;
#                        yamllint would add style-only findings plus a config file
#                        outside our declared namespace.
#   markdownlint  NO   — same config-placement problem, and default rulesets are
#                        noise on prose. Replaced by a relative-link check over
#                        docs/pixeloven/** + docs/adr/**, which catches the defect
#                        class that actually bites a docs-heavy fork surface.
#   osv-scanner   NO   — NOTHING TO SCAN. The only manifest in the tree is
#   dep-review    NO     `.opencode/plugins/package.json` = {"private","type"} with
#                        zero dependencies, and there is no lockfile anywhere. Both
#                        gates would be decorative. A tripwire below fails the
#                        build the moment a real manifest or lockfile appears, so
#                        this decision cannot silently rot.
#   semgrep       NO   — registry rulesets are login-gated, so an unauthenticated
#                        job would report zero findings instead of a useful scan.
#
# ── Follow-ups ────────────────────────────────────────────────────────────────
#   * If org rulesets ever require one stable aggregate check name, add a
#     `re-actors/alls-green` aggregator job deliberately.
name: PixelOven gates

on:
  pull_request:
  push:
    branches: [main]
    tags-ignore: ['**']

permissions:
  contents: read

concurrency:
  group: pixeloven-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # G-2: exact pins, with the checksum recorded here rather than trusted at
  # download time. Bumping a version means bumping its digest in the same commit.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # Full history: this fork carries 400 inherited upstream commits and the
          # scan is over all of them, not just the tip. Measured ~1s.
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Scan full history for secrets
        # --redact so a candidate secret is never echoed into a public log (G-3).
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/gitleaks" git . --redact --no-banner

  lint:
    name: workflows · docs · fork contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # The fork-contract assertions diff against the fork-point commit and
          # read upstream's README blob out of history.
          fetch-depth: 0

      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          "$RUNNER_TEMP/bin/actionlint" -version

      - name: Lint the workflows PixelOven owns
        # Scoped to pixeloven-*.yml on purpose. The complete upstream lint owner
        # separately checks every workflow, including ADR-0010's bounded hunks.
        # shellcheck is on PATH on ubuntu-latest, so actionlint also shellchecks
        # our `run:` blocks.
        run: |
          set -euo pipefail
          shellcheck --version | head -2
          "$RUNNER_TEMP/bin/actionlint" -color .github/workflows/pixeloven-*.yml

      - name: Check relative links in PixelOven docs
        # Replaces a generic markdown linter: this is the defect class that
        # actually bites here (ADRs and docs cross-link heavily), it needs no
        # config file outside our namespace, and it adds no dependency.
        run: |
          set -euo pipefail
          broken=0
          checked=0
          while IFS= read -r doc; do
            dir=$(dirname "$doc")
            targets=$(grep -oE '\]\([^)]+\)' "$doc" | sed -E 's/^\]\(//; s/\)$//' || true)
            while IFS= read -r target; do
              [ -n "$target" ] || continue
              case "$target" in
                http://*|https://*|mailto:*|'#'*) continue ;;
              esac
              path="${target%%#*}"
              [ -n "$path" ] || continue
              checked=$((checked + 1))
              if [ ! -e "$dir/$path" ]; then
                echo "::error file=$doc::broken relative link -> $target"
                broken=1
              fi
            done < <(printf '%s\n' "$targets")
          done < <(find docs/pixeloven docs/adr -name '*.md' | sort)
          [ "$broken" -eq 0 ] || { echo "::error::broken relative links in PixelOven docs"; exit 1; }
          echo "$checked relative links in docs/pixeloven and docs/adr all resolve"

      - name: Dependency-manifest tripwire
        # We deliberately ship NO osv-scanner / dependency-review job because
        # there is nothing to scan (see the header). This step is the guard on
        # that decision: the moment a lockfile or a dependency-bearing manifest
        # lands - from our own work or from an upstream merge - this fails and
        # the remedy is ADDITIVE: enable the scanner in this workflow.
        run: |
          set -euo pipefail
          # Lockfiles, and manifests that are dependency-bearing by construction.
          hits=$(git ls-files | grep -E '(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|uv\.lock|poetry\.lock|Pipfile|Pipfile\.lock|requirements[^/]*\.txt|pyproject\.toml|go\.mod|go\.sum|Cargo\.toml|Cargo\.lock|Gemfile|Gemfile\.lock)$' || true)
          # package.json can legitimately declare no dependencies at all - the one
          # in this tree is {"private": true, "type": "module"}. Only flag it once
          # it actually declares some.
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            if grep -qE '"(dependencies|devDependencies|peerDependencies|optionalDependencies)"[[:space:]]*:' "$pkg"; then
              hits="${hits}${pkg}"$'\n'
            fi
          done < <(git ls-files | grep -E '(^|/)package\.json$' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits" | sed '/^$/d'
            echo "::error::a dependency lockfile or manifest now exists - add an osv-scanner job to this workflow (see the header)"
            exit 1
          fi
          echo "no dependency lockfile or manifest present; osv-scanner stays omitted"

      - name: Fork-contract and identity assertions
        # Task A1.1's "grep clean" acceptance, enforced continuously instead of
        # claimed once. Documented in docs/pixeloven/identity.md section 5 -
        # keep the two in step.
        run: |
          set -uo pipefail
          # The upstream commit our tree currently contains. NOT the frozen fork
          # point: A4/A5 ask "what have WE changed on top of upstream", and after
          # an upstream merge the fork point is the wrong baseline - it reports
          # upstream's own commits as our modifications. Found by the A1.4 merge
          # rehearsal; see docs/pixeloven/upstream-merges.md. Every upstream-merge
          # PR advances this file, which is also what keeps the ledger honest.
          PIN=$(tr -d '[:space:]' < docs/pixeloven/upstream-pin)
          fail=0
          bad() { printf '::error::%s\n' "$1"; fail=1; }

          banner() { sed -n '/<!-- PIXELOVEN-FORK-BANNER:START -->/,/<!-- PIXELOVEN-FORK-BANNER:END -->/p' README.md; }
          # Fenced code blocks are stripped: identity.md quotes these very
          # patterns and would otherwise match itself.
          corpus() {
            { banner; cat NOTICE; find docs/pixeloven docs/adr -name '*.md' -exec cat {} +; } \
              | awk '/^```/{f=!f; next} !f'
          }

          echo '== A1 - the project is never named firstmate'
          out=$(corpus | grep -niE 'pixeloven/firstmate|(this|the) (repo|repository|project) is (a |the )?firstmate|named? firstmate' || true)
          [ -z "$out" ] || { printf '%s\n' "$out"; bad "A1: PixelOven-authored text names this project 'firstmate'"; }

          echo '== A2 - every self-referential PixelOven URL is a real PixelOven repo'
          out=$(corpus | grep -oE 'github\.com/pixeloven/[A-Za-z0-9._-]+' | sed 's/\.git$//' | sort -u \
                | grep -vE '^github\.com/pixeloven/(operator|crew|pulse|lattice|ci|gh-axi|chrome-devtools-axi|lavish-axi|tasks-axi|quota-axi|no-mistakes)$' || true)
          [ -z "$out" ] || { printf '%s\n' "$out"; bad "A2: unexpected pixeloven/* repository reference"; }

          echo '== A3 - the project is never capitalized as a proper noun (G-7)'
          out=$( { banner | grep -nE '\bOperator\b'
                   grep -nE '\bOperator\b' NOTICE
                   find docs/pixeloven docs/adr -name '*.md' \
                        ! -name 'identity.md' ! -name '0004-the-name-operator.md' -print0 \
                     | xargs -0 grep -nE '\bOperator\b'; } 2>/dev/null || true)
          [ -z "$out" ] || { printf '%s\n' "$out"; bad "A3: 'Operator' used as a proper noun - write operator in code style"; }

          echo "== A4 - O-1: the diff against upstream $PIN stays inside PixelOven namespaces and accepted ADR overrides"
          out=$(git diff --name-only "$PIN" \
                | grep -vE '^(docs/pixeloven/|docs/adr/|\.github/workflows/pixeloven-|bin/backends/|\.agents/skills/po-|bin/fm-install-pixeloven-tool\.sh$|tests/fm-install-pixeloven-tool\.test\.sh$|\.github/workflows/(ci|no-mistakes-required|pixeloven-release)\.yml$|bin/(fm-bootstrap|fm-test-run|fm-spawn|fm-delivery-lane|fm-lint-workflows)\.sh$|tests/(fm-bootstrap|fm-lint-workflows|fm-no-mistakes-required|fm-task-delivery)\.test\.sh$|CONTRIBUTING\.md$|docs/(configuration\.md|documentation-audiences\.json|examples/watched-tools\.json|verification/delivery-lane\.md)$|README\.md$|NOTICE$)' || true)
          [ -z "$out" ] || { printf '%s\n' "$out"; bad "A4: path is outside PixelOven namespaces and accepted ADR override sets"; }

          echo '== A5 - the README exception stays one bounded banner block'
          git show "$PIN":README.md > "$RUNNER_TEMP/upstream-README.md"
          sed '/<!-- PIXELOVEN-FORK-BANNER:START -->/,/<!-- PIXELOVEN-FORK-BANNER:END -->/d' README.md \
            | sed '1{/^$/d}' \
            | diff - "$RUNNER_TEMP/upstream-README.md" \
            || bad "A5: README.md differs from upstream outside the PixelOven banner block"

          echo '== A6 - upstream repo invariant: personal fleet paths stay untracked'
          out=$(git ls-files -- data state config projects .no-mistakes || true)
          [ -z "$out" ] || { printf '%s\n' "$out"; bad "A6: personal fleet paths are tracked"; }

          echo '== A7 - the recorded upstream pin is real and is contained in this tree'
          if ! git cat-file -e "${PIN}^{commit}" 2>/dev/null; then
            bad "A7: docs/pixeloven/upstream-pin is not a commit in this repository"
          elif ! git merge-base --is-ancestor "$PIN" HEAD; then
            bad "A7: docs/pixeloven/upstream-pin ($PIN) is not an ancestor of HEAD - the pin was advanced without merging"
          fi

          echo '== A8 - the companion source inventory selects exactly six matching PixelOven forks'
          source_rows=$(bin/fm-install-pixeloven-tool.sh --list 2>/dev/null) \
            || { source_rows=; bad 'A8: companion source inventory could not be read'; }
          source_names=$(printf '%s\n' "$source_rows" | awk -F '\t' 'BEGIN { ORS="" } { if (NR > 1) printf ","; printf "%s", $1 }')
          [ "$source_names" = 'gh-axi,chrome-devtools-axi,lavish-axi,tasks-axi,quota-axi,no-mistakes' ] \
            || bad "A8: unexpected companion source names or order: $source_names"
          out=$(printf '%s\n' "$source_rows" | awk -F '\t' 'NF != 5 || $2 != "https://github.com/pixeloven/" $1 { print }')
          [ -z "$out" ] || { printf '%s\n' "$out"; bad 'A8: a companion source does not select its matching PixelOven fork'; }

          [ "$fail" -eq 0 ] || { echo 'fork-contract assertions FAILED'; exit 1; }
          echo 'fork-contract assertions PASSED'
